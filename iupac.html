<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IUPAC Interactive Periodic Table - 四语元素周期表与相态模拟器</title>
<style>
:root {
  --bg-deep: #060913;
  --bg-panel: rgba(13, 20, 38, 0.92);
  --bg-card: rgba(18, 28, 52, 0.78);
  --border-glow: rgba(56, 189, 248, 0.28);
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  
  --cat-alkali: 244, 63, 94;
  --cat-alkaline: 249, 115, 22;
  --cat-transition: 59, 130, 246;
  --cat-post-transition: 16, 185, 129;
  --cat-metalloid: 20, 184, 166;
  --cat-nonmetal: 132, 204, 22;
  --cat-halogen: 234, 179, 8;
  --cat-noble: 168, 85, 247;
  --cat-lanthanide: 236, 72, 153;
  --cat-actinide: 217, 70, 239;

  --phase-solid: #64748b;
  --phase-liquid: #3b82f6;
  --phase-gas: #ef4444;
  --phase-unknown: #334155;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-deep);
  background-image:
    radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
    linear-gradient(rgba(15, 23, 42, 0.7) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15, 23, 42, 0.7) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.app-container { max-width: 1760px; margin: 0 auto; padding: 16px 20px 36px; }

.top-header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 16px; padding: 16px 22px; background: var(--bg-panel); border: 1px solid var(--border-glow);
  border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px); margin-bottom: 12px;
}
.brand-area { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 46px; height: 46px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(168,85,247,0.25));
  border: 1px solid rgba(56,189,248,0.5); display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px; color: #38bdf8; box-shadow: 0 0 18px rgba(56,189,248,0.25);
}
.brand-title h1 { font-size: 21px; font-weight: 700; background: linear-gradient(90deg, #f8fafc, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand-title p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.controls-area { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.search-box { position: relative; min-width: 270px; }
.search-box input {
  width: 100%; background: rgba(8,13,26,0.85); border: 1px solid rgba(148,163,184,0.3);
  color: var(--text-main); padding: 9px 34px 9px 14px; border-radius: 10px; font-size: 13px; outline: none; transition: all 0.2s;
}
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(56,189,248,0.3); }
.lang-switcher { display: flex; background: rgba(8,13,26,0.85); padding: 4px; border-radius: 11px; border: 1px solid rgba(148,163,184,0.25); gap: 4px; }
.lang-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.lang-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; box-shadow: 0 2px 10px rgba(37,99,235,0.45); }

.temp-control-panel {
  background: var(--bg-panel); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 14px;
  padding: 16px 20px; margin-bottom: 16px; backdrop-filter: blur(12px); box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
}
.temp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px;}
.temp-readout { font-size: 26px; font-weight: 800; color: var(--accent); display: flex; align-items: baseline; gap: 10px;}
.temp-readout small { font-size: 14px; color: var(--text-muted); font-weight: 500; font-family: "SFMono-Regular", Consolas, monospace;}
.temp-controls { display: flex; gap: 8px; flex-wrap: wrap;}
.temp-btn {
  background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.3);
  color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.temp-btn:hover { border-color: var(--accent); color: var(--accent); }
.temp-btn.playing { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);}
.temp-slider-container { margin: 16px 0; }
.temp-slider-container input[type=range] { 
  width: 100%; cursor: pointer; accent-color: var(--accent); height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; appearance: none; outline: none;
}
.temp-slider-container input[type=range]::-webkit-slider-thumb {
  appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 10px #38bdf8;
}
.temp-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;}
.temp-presets button { font-size: 11px; padding: 4px 10px; border-radius: 99px; }
.temp-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-btn {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  background: rgba(15, 23, 42, 0.6); border-radius: 99px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; transition: all 0.2s; user-select: none;
}
.stat-btn:hover, .stat-btn.active { border-color: var(--accent); background: rgba(30, 41, 59, 0.9); box-shadow: 0 0 12px rgba(56,189,248,0.2);}
.badge { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 6px; font-weight: 800; font-size: 11.5px; color: #fff;}
.badge.S { background: var(--phase-solid); }
.badge.L { background: var(--phase-liquid); }
.badge.G { background: var(--phase-gas); }
.badge.U { background: var(--phase-unknown); opacity: 0.8; }

.category-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--bg-panel); border: 1px solid rgba(148,163,184,0.18); border-radius: 14px; margin-bottom: 16px; align-items: center; }
.cat-chip { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.14); background: rgba(15,23,42,0.75); transition: all 0.2s; user-select: none; }
.cat-chip.active { box-shadow: 0 0 14px rgba(56,189,248,0.4); border-color: #ffffff; background: rgba(30,41,59,0.98); }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; }

.table-scroll-wrapper { width: 100%; overflow-x: auto; padding-bottom: 10px; }
.periodic-grid { display: grid; grid-template-columns: repeat(18, minmax(68px, 1fr)); grid-auto-rows: 78px; gap: 6px; min-width: 1320px; }

.el-cell {
  position: relative; border-radius: 10px; padding: 5px 6px; display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; background: rgba(var(--cat-rgb), 0.16); border: 1px solid rgba(var(--cat-rgb), 0.48);
  transition: transform 0.1s ease, box-shadow 0.15s ease, opacity 0.2s ease, border-color 0.15s ease; user-select: none; overflow: hidden;
}
.el-cell:hover {
  transform: scale(1.09); z-index: 20; background: rgba(var(--cat-rgb), 0.3); border-color: rgba(var(--cat-rgb), 0.95);
  box-shadow: 0 8px 22px rgba(0,0,0,0.65), 0 0 16px rgba(var(--cat-rgb), 0.55);
}
.el-cell.selected { border: 2px solid #ffffff; box-shadow: 0 0 20px rgba(var(--cat-rgb), 0.85); z-index: 15; }
.el-cell.dimmed { opacity: 0.16; filter: grayscale(75%); pointer-events: none; }

/* 核心修复 1: 角标定位到右下角，避免遮挡原子序数质量数 */
.el-cell .phase-badge {
  position: absolute; bottom: 3px; right: 3px; font-size: 9px; font-weight: 800; padding: 1px 4.5px; border-radius: 4px;
  color: white; transition: background 0.25s ease; font-family: "SFMono-Regular", monospace; z-index: 2;
}
.el-cell.phase-solid .phase-badge { background: var(--phase-solid); }
.el-cell.phase-liquid .phase-badge { background: var(--phase-liquid); }
.el-cell.phase-gas .phase-badge { background: var(--phase-gas); }
.el-cell.phase-unknown .phase-badge { background: var(--phase-unknown); opacity: 0.5; }

.el-top { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; line-height: 1; }
.el-num { font-weight: 700; color: rgba(255,255,255,0.92); }
.el-mass { font-size: 9.5px; color: rgba(226,232,240,0.72); font-family: "SFMono-Regular", Consolas, monospace; }
.el-symbol { font-size: 21px; font-weight: 800; text-align: center; line-height: 1.05; color: #ffffff; text-shadow: 0 0 10px rgba(var(--cat-rgb), 0.6); }

/* 核心修复 1: 为元素名称增加右侧 padding 避免重叠 */
.el-name { font-size: 10.5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; padding-right: 18px; }

.series-placeholder {
  border-radius: 10px; padding: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  cursor: pointer; border: 1px dashed rgba(var(--cat-rgb), 0.65); background: rgba(var(--cat-rgb), 0.1); transition: all 0.2s;
}
.series-placeholder:hover { background: rgba(var(--cat-rgb), 0.24); }
.series-placeholder .sp-range {
  font-size: 11px;
  font-weight: 700;
  color: rgba(var(--cat-rgb), 1);
  line-height: 1.2;
  white-space: nowrap;
}
.series-placeholder .sp-title {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  line-height: 1.2;
  white-space: nowrap;
}
.series-row-label { display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; font-size: 12.5px; font-weight: 700; color: var(--text-muted); }

.summary-banner {
  grid-column: 3 / 13; grid-row: 1 / 4; background: rgba(13,22,42,0.78); border: 1px solid rgba(56,189,248,0.22);
  border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(8px);
}
.banner-left { display: flex; align-items: center; gap: 16px; }
.banner-symbol-box { width: 86px; height: 86px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 10px; background: rgba(var(--cat-rgb), 0.22); border: 2px solid rgba(var(--cat-rgb), 0.8); box-shadow: 0 0 24px rgba(var(--cat-rgb), 0.35); flex-shrink: 0; }
.banner-symbol-box .bs-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; }
.banner-symbol-box .bs-sym { font-size: 30px; font-weight: 800; text-align: center; line-height: 1; }
.banner-symbol-box .bs-name { font-size: 11px; text-align: center; }
.banner-info h2 { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
.banner-langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.banner-lang-tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: rgba(30,41,59,0.85); border: 1px solid rgba(148,163,184,0.25); color: #cbd5e1; }
.banner-quick-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
.banner-open-btn { padding: 9px 15px; border-radius: 10px; border: 1px solid rgba(56,189,248,0.55); background: linear-gradient(135deg, rgba(14,165,233,0.25), rgba(37,99,235,0.25)); color: #38bdf8; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.banner-open-btn:hover { background: linear-gradient(135deg, rgba(14,165,233,0.45), rgba(37,99,235,0.45)); color: #ffffff; }

.drawer-backdrop { position: fixed; inset: 0; background: rgba(2,6,23,0.68); backdrop-filter: blur(5px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.detail-drawer {
  position: fixed; top: 0; right: 0; width: min(760px, 95vw); height: 100vh; background: #080d1a; border-left: 1px solid rgba(56,189,248,0.35);
  box-shadow: -15px 0 45px rgba(0,0,0,0.8); z-index: 101; transform: translateX(102%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; overflow: hidden;
}
.detail-drawer.open { transform: translateX(0); }
.drawer-header { padding: 18px 24px; background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(8,13,26,0.95)); border-bottom: 1px solid rgba(148,163,184,0.2); display: flex; justify-content: space-between; align-items: center; }
.drawer-title-group { display: flex; align-items: center; gap: 16px; }
.drawer-symbol-badge { width: 68px; height: 68px; border-radius: 14px; background: rgba(var(--cat-rgb), 0.2); border: 2px solid rgba(var(--cat-rgb), 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(var(--cat-rgb), 0.3); }
.drawer-symbol-badge .ds-num { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.drawer-symbol-badge .ds-sym { font-size: 28px; font-weight: 800; color: #ffffff; line-height: 1.05; }
.drawer-main-titles h2 { font-size: 22px; font-weight: 800; color: #ffffff; }
.drawer-cat-pill { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(var(--cat-rgb), 0.22); border: 1px solid rgba(var(--cat-rgb), 0.65); color: #f8fafc; }
.drawer-nav-btns { display: flex; gap: 8px; }
.icon-btn { background: rgba(30,41,59,0.8); border: 1px solid rgba(148,163,184,0.3); color: var(--text-main); padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.drawer-body { padding: 20px 24px 36px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.detail-section { background: rgba(15,23,42,0.65); border: 1px solid rgba(148,163,184,0.18); border-radius: 14px; padding: 16px 18px; }
.section-title { font-size: 14.5px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(56,189,248,0.18); padding-bottom: 8px; }
.section-title::before { content: ""; width: 4px; height: 15px; background: #38bdf8; border-radius: 2px; display: inline-block; }

.lang-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px;}
.lang-card { background: rgba(8,13,26,0.78); border: 1px solid rgba(148,163,184,0.2); border-radius: 10px; padding: 10px 12px; }
.lang-card .lc-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.lang-card .lc-val { font-size: 14px; font-weight: 700; color: #f8fafc; word-break: break-word; }

.prop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.prop-grid-wide { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.prop-item { background: rgba(8,13,26,0.72); border: 1px solid rgba(148,163,184,0.15); border-radius: 10px; padding: 9px 12px; }
.prop-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
.prop-value { font-size: 13.5px; font-weight: 500; color: #f1f5f9; line-height: 1.45; word-wrap: break-word;}
.null-badge { display: inline-block; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: #64748b; background: rgba(30,41,59,0.6); padding: 1px 7px; border-radius: 4px; border: 1px dashed rgba(100,116,139,0.4); }

.atom-visual-row { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; }
.bohr-box { width: 200px; height: 200px; background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(8,13,26,0.85) 70%); border: 1px solid rgba(56,189,248,0.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.shell-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.shell-pill { background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-family: "SFMono-Regular", monospace; color: #e0f2fe; }

@media (max-width: 1100px) { .lang-grid-4 { grid-template-columns: repeat(2, 1fr); } .atom-visual-row { grid-template-columns: 1fr; justify-items: center; } }
</style>
</head>
<body>
<div class="app-container" id="app">
  <header class="top-header">
    <div class="brand-area">
      <div class="brand-icon">Pt</div>
      <div class="brand-title">
        <h1 id="ui-main-title">IUPAC 交互式元素周期表</h1>
        <p id="ui-sub-title">118 Elements · 四语相态热力学引擎 · 全量深度数据库</p>
      </div>
    </div>
    <div class="controls-area">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索名称、符号或原子序数..." autocomplete="off">
      </div>
      <div class="lang-switcher" id="lang-switcher">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="la">Latina</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
      </div>
    </div>
  </header>

  <div class="temp-control-panel">
    <div class="temp-header">
      <div class="temp-readout">
        <span id="temp-k">298 K</span>
        <small id="temp-c">(25 ℃)</small>
      </div>
      <div class="temp-controls">
        <button class="temp-btn" id="btn-minus-100">-100K</button>
        <button class="temp-btn" id="btn-minus-10">-10K</button>
        <button class="temp-btn" id="btn-plus-10">+10K</button>
        <button class="temp-btn" id="btn-plus-100">+100K</button>
        <button class="temp-btn" id="btn-play-temp">▶ <span id="ui-play">自动升温</span></button>
      </div>
    </div>
    <div class="temp-slider-container">
      <input type="range" id="temp-slider" min="0" max="1000" value="298">
    </div>
    <div class="temp-presets" id="ui-presets">
      <button class="temp-btn" data-t="0">0K (绝对零度)</button>
      <button class="temp-btn" data-t="77">77K (液氮)</button>
      <button class="temp-btn" data-t="298">298K (室温)</button>
      <button class="temp-btn" data-t="373">373K (水沸腾)</button>
      <button class="temp-btn" data-t="1358">1358K (金熔点)</button>
      <button class="temp-btn" data-t="1811">1811K (铁熔点)</button>
      <button class="temp-btn" data-t="5778">5778K (太阳表面)</button>
    </div>
    <div class="temp-stats" id="ui-stats">
      <div class="stat-btn" data-filter="solid"><span class="badge S">S</span> <span class="sl">固态</span>: <span id="stat-s">0</span></div>
      <div class="stat-btn" data-filter="liquid"><span class="badge L">L</span> <span class="sl">液态</span>: <span id="stat-l">0</span></div>
      <div class="stat-btn" data-filter="gas"><span class="badge G">G</span> <span class="sl">气态</span>: <span id="stat-g">0</span></div>
      <div class="stat-btn" data-filter="unknown"><span class="badge U">?</span> <span class="sl">未知</span>: <span id="stat-u">0</span></div>
    </div>
  </div>

  <nav class="category-bar" id="category-bar"></nav>

  <div class="table-scroll-wrapper">
    <main class="periodic-grid" id="periodic-grid"></main>
  </div>
</div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="detail-drawer" id="detail-drawer">
  <div class="drawer-header" id="drawer-header">
    <div class="drawer-title-group">
      <div class="drawer-symbol-badge" id="drawer-badge">
        <span class="ds-num" id="drawer-num">1</span>
        <span class="ds-sym" id="drawer-sym">H</span>
      </div>
      <div class="drawer-main-titles">
        <h2 id="drawer-title">氢 · Hydrogen</h2>
        <span class="drawer-cat-pill" id="drawer-cat">非金属</span>
      </div>
    </div>
    <div class="drawer-nav-btns">
      <button class="icon-btn" id="prev-el-btn">◀</button>
      <button class="icon-btn" id="next-el-btn">▶</button>
      <button class="icon-btn" id="close-drawer-btn">✕</button>
    </div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
const T = (zh, en, la, ja) => ({ zh, en, la, ja });

const Y_PRE = T("史前时代", "Prehistoric/Ancient", "Antiquitas", "先史時代");

function buildFullElementProfile(raw) {
  const [
    num, sym, mass, zh, en, la, ja, cat, period, group, stateCode,
    rawDensity, rawMelt, rawBoil, electroneg, ionEnergy, radius, oxStates,
    eConfig, shells, discYear, discoverer, etymology, applications
  ] = raw;

  // 区块动态计算 (s, p, d, f)
  let block = "unknown";
  if (cat === "lanthanide" || cat === "actinide") block = "f";
  else if (group === 1 || group === 2 || num === 2) block = "s";
  else if (group >= 13 && group <= 18) block = "p";
  else if (group >= 3 && group <= 12) block = "d";

  // 国际化格式与单位转化 (STP 密度和 Kelvin)
  let tMelt = rawMelt ? parseFloat(rawMelt) + 273.15 : null;
  let tBoil = rawBoil ? parseFloat(rawBoil) + 273.15 : null;
  let formatTemp = (k, c) => k !== null ? `${k.toFixed(2)} K (${c} ℃)` : null;
  
  let dNum = rawDensity ? parseFloat(rawDensity) * 1000 : null; // -> kg/m³
  let dStr = dNum ? (stateCode === "g" ? `${dNum.toFixed(4).replace(/\.?0+$/,'')} kg/m³ (STP)` : `${dNum.toFixed(2).replace(/\.?0+$/,'')} kg/m³`) : null;

  // 默认字典回退机制
  let met = T("未知属性", "Unknown property", "Ignotum", "未知の性質");
  let red = T("无显著特征", "No distinct features", "Nulla proprietas", "特になし");
  let aci = T("中性或两性", "Neutral or amphoteric", "Neutrum/amphotericum", "中性または両性");
  let tox = T("低毒或无毒", "Low/no toxicity", "Toxicitas humilis", "低毒性/無毒");
  let fla = T("不可燃", "Non-flammable", "Non inflammabilis", "不燃性");
  let thS = T("热稳定性高", "High thermal stability", "Stabilitas thermica alta", "高い熱安定性");
  let rea = T("化学性质稳定", "Chemically stable", "Stabilis", "化学的に安定");
  let iso = T("存在稳定同位素", "Stable isotopes exist", "Isotopa stabilia", "安定同位体が存在");
  let rad = T("无放射性", "Non-radioactive", "Non radioactivus", "非放射性");
  let cry = DICT.crystal.bcc;
  let mag = DICT.magnetism.para;
  let color = T("银白色金属光泽", "Silver-white metallic luster", "Nitor metallicus albus", "銀白色の金属光沢");
  let elecCond = T("金属导体", "Metallic conductor", "Conductor metallicus", "金属導体");
  let thermCond = T("金属导热体", "Metallic thermal conductor", "Conductor thermicus", "金属熱伝導体");
  let hard = T("未知硬度", "Unknown hardness", "Duritia ignota", "硬度未知");

  // 大类推导 (为了节省Token采用简化)
  if (cat === "alkali") {
    met = T("极强金属性","Extreme metallic","Metallum fortissimum","極めて強い金属性"); tox = T("强碱性腐蚀","Strong alkaline corrosion","Corrosivitas alcalina","強アルカリ腐食性"); fla = T("极易燃/遇水爆炸","Highly flammable/reactive","Inflammabilis/Explosivus","極めて可燃性・水と爆発的に反応"); cry = DICT.crystal.bcc; mag = DICT.magnetism.para;
  } else if (cat === "noble") {
    color = T("无色无味气体","Colorless odorless gas","Gas incolor/inodorus","無色無臭の気体"); met = T("惰性非金属","Inert nonmetal","Gas iners","不活性非金属"); tox = T("无毒致息气","Non-toxic asphyxiant","Gas sine toxicitate","無毒（窒息性）"); rea = T("极度化学惰性","Extremely inert","Iners","極めて不活性"); cry = DICT.crystal.fcc; mag = DICT.magnetism.dia; elecCond = T("绝缘体","Insulator","Insulator","絶縁体");
  } else if (num >= 104) {
    met = T("超重人工元素","Superheavy synthetic","Elementum supergravis","超重人工元素"); rad = T("极短半衰期高能α衰变","Ultra-short half-life alpha decay","Decasus alpha brevissimus","極短半減期・高エネルギーα崩壊"); tox = T("极强放射毒性","Extreme radiation toxicity","Toxicitas radioactiva","極度の放射能毒性"); rea = T("极微量瞬时合成","Synthesized fleetingly in ultra-traces","Synthesis perbrevis","極微量で瞬間的な合成のみ");
  }

  // 挂载特定覆盖
  let override = SPECIFIC_OVERRIDES[num] || {};
  
  return {
    Z: num, sym: sym, mass: mass, names: T(zh, en, la, ja),
    cat: cat, period: period, group: group, block: block,
    gridRow: (num >= 57 && num <= 71) ? 9 : (num >= 89 && num <= 103) ? 10 : period,
    gridCol: (num >= 57 && num <= 71) ? (num - 57) + 3 : (num >= 89 && num <= 103) ? (num - 89) + 3 : group,
    nucChg: `+${num}`, pro: num, neu: Math.round(parseFloat(mass.replace(/[\[\]]/g,""))) - num, ele: num,
    eConfig: eConfig, shells: shells, electroneg: electroneg, ionEnergy: ionEnergy ? `${ionEnergy} kJ/mol` : null, radius: radius ? `${radius} pm` : null, oxStates: oxStates,
    rawMelt: tMelt, rawBoil: tBoil,
    phys: { density: dStr, melt: formatTemp(tMelt, rawMelt), boil: formatTemp(tBoil, rawBoil), cry: override.crystal || cry, mag: override.magnetism || override.mag || mag, color: override.color || color, elecCond: override.elecCond || elecCond, thermCond: override.thermCond || thermCond, hard: override.hard || hard },
    chem: { met: override.met || met, red: override.red || red, aci: override.aci || aci, thS: override.thS || thS, fla: override.fla || fla, tox: override.tox || tox, rea: override.rea || rea, iso: override.iso || iso, rad: override.rad || rad, alo: override.alo || T("无","None","Nullum","なし") },
    disc: { year: discYear, discoverer: discoverer, ety: etymology, app: applications }
  };
}

const ELEMENTS = CORE_RAW.map(buildFullElementProfile);

// 全局状态管理
const state = {
  lang: "zh", activeCategory: null, phaseFilter: null, searchQuery: "",
  selectedZ: 14, drawerOpen: false, tempK: 298.15, isPlaying: false
};

function S(val, asHtml = false) {
  if (val === null || val === undefined) return `<span class="null-badge">null</span>`;
  let str = (typeof val === "object") ? (val[state.lang] || val.en || String(val)) : String(val);
  return asHtml ? str : str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function getPhase(tempK, el) {
  if (el.Z >= 104 || (el.rawMelt === null && el.rawBoil === null)) return 'unknown';
  if (el.Z === 6) return tempK < 3915 ? 'solid' : 'gas'; // Carbon sublimation approx
  let m = el.rawMelt !== null ? el.rawMelt : Infinity;
  let b = el.rawBoil !== null ? el.rawBoil : Infinity;
  if (tempK < m) return 'solid';
  if (tempK >= m && tempK < b) return 'liquid';
  return 'gas';
}

function matchesSearch(el) {
  if (state.activeCategory && el.cat !== state.activeCategory) return false;
  const q = state.searchQuery.trim().toLowerCase();
  if (!q) return true;
  if (String(el.Z) === q || el.sym.toLowerCase().includes(q)) return true;
  if (el.names.zh.includes(q) || el.names.en.toLowerCase().includes(q) || el.names.la.toLowerCase().includes(q) || el.names.ja.includes(q)) return true;
  return false;
}

// 高性能批量状态更新器 (处理 DOM / Class 切换，保证 60fps 滑动)
function updateGridState() {
  const L = UI[state.lang];
  document.getElementById("sp-lan").textContent = L.lan; 
  document.getElementById("sp-act").textContent = L.act;
  document.getElementById("lb-lan").textContent = "57-71 " + L.lan + " ▸"; 
  document.getElementById("lb-act").textContent = "89-103 " + L.act + " ▸";
  
  const statBox = document.getElementById("ui-stats");
  statBox.querySelector("[data-filter='solid'] .sl").textContent = DICT.phase.solid.t[state.lang];
  statBox.querySelector("[data-filter='liquid'] .sl").textContent = DICT.phase.liquid.t[state.lang];
  statBox.querySelector("[data-filter='gas'] .sl").textContent = DICT.phase.gas.t[state.lang];
  statBox.querySelector("[data-filter='unknown'] .sl").textContent = DICT.phase.unknown.t[state.lang];

  let counts = { solid: 0, liquid: 0, gas: 0, unknown: 0 };
  
  ELEMENTS.forEach(el => {
    const phase = getPhase(state.tempK, el);
    counts[phase]++;
    const cell = document.getElementById(`el-cell-${el.Z}`);
    if (cell) {
      document.getElementById(`name-${el.Z}`).textContent = state.lang === 'ja' ? el.names.ja.split(" (")[0] : el.names[state.lang];
      cell.className = `el-cell phase-${phase} ${el.Z === state.selectedZ ? "selected" : ""}`;
      if (!matchesSearch(el) || (state.phaseFilter && phase !== state.phaseFilter)) cell.classList.add("dimmed");
      const badge = cell.querySelector('.phase-badge');
      if (badge) {
        badge.textContent = DICT.phase[phase].badge;
        badge.className = `phase-badge ${DICT.phase[phase].badge}`;
      }
    }
  });

  document.getElementById('stat-s').textContent = counts.solid;
  document.getElementById('stat-l').textContent = counts.liquid;
  document.getElementById('stat-g').textContent = counts.gas;
  document.getElementById('stat-u').textContent = counts.unknown;

  statBox.querySelectorAll(".stat-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.filter === state.phaseFilter));

  renderSummaryBanner(ELEMENTS[state.selectedZ - 1]);
  if (state.drawerOpen) renderDetailDrawer();
}

function renderHeaderUI() {
  const L = UI[state.lang];
  document.getElementById("ui-main-title").textContent = L.title;
  document.getElementById("ui-sub-title").textContent = L.sub;
  document.getElementById("search-input").placeholder = L.search;
  document.getElementById("ui-play").textContent = state.isPlaying ? L.pause : L.play;
  document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === state.lang));
  const presets = document.getElementById("ui-presets").querySelectorAll("button");
  L.presets.forEach((txt, i) => { if(presets[i]) presets[i].textContent = txt; });
}

function renderCategoryBar() {
  const bar = document.getElementById("category-bar");
  let html = `<div class="cat-chip ${!state.activeCategory ? "active" : ""}" data-cat=""><span class="cat-dot" style="background: linear-gradient(135deg, #38bdf8, #a855f7)"></span><span>${UI[state.lang].all}</span></div>`;
  Object.keys(CATEGORIES).forEach(cat => {
    const meta = CATEGORIES[cat];
    html += `<div class="cat-chip ${state.activeCategory === cat ? "active" : ""}" data-cat="${cat}"><span class="cat-dot" style="background:${meta.hex};box-shadow:0 0 8px ${meta.hex}"></span><span>${meta.t[state.lang]}</span></div>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll(".cat-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.activeCategory = state.activeCategory === chip.dataset.cat ? null : chip.dataset.cat;
      renderCategoryBar(); updateGridState();
    });
  });
}

    <div class="series-placeholder" data-series="lanthanide" style="grid-row: 6; grid-column: 3; --cat-rgb: var(--cat-lanthanide)">

    </div>
    <div class="series-placeholder" data-series="actinide" style="grid-row: 7; grid-column: 3; --cat-rgb: var(--cat-actinide)">

  grid.querySelectorAll(".series-placeholder").forEach(sp => {

}

        <div class="prop-item"><div class="prop-label">${F.Cat}</div><div class="prop-value">${S((CATEGORIES[el.cat]||{t:""}).t)}</div></div>

        <div class="prop-item"><div class="prop-label">${F.Ox}</div><div class="prop-value">${S(el.oxStates)}</div></div>

          <div class="prop-item"><div class="prop-label">${F.Ncl}</div><div class="prop-value">${el.pro} p⁺ / ${el.neu} n⁰ / ${el.ele} e⁻</div></div>
          <div class="prop-item" style="grid-column: 1 / -1;"><div class="prop-label">${F.EC}</div><div class="prop-value" style="color:#38bdf8; font-family:monospace">${el.eConfig}</div></div>
          <div class="prop-item" style="grid-column: 1 / -1;"><div class="prop-label">${F.Shl}</div><div class="shell-pills">${el.shells.map((c,i)=>`<span class="shell-pill">${['K','L','M','N','O','P','Q'][i]}: ${c}e⁻</span>`).join('')}</div></div>

    <section class="detail-section"><div class="section-title">${L.sec3}</div>

        <div class="prop-item"><div class="prop-label">${F.Den}</div><div class="prop-value">${S(el.phys.density)}</div></div>

        <div class="prop-item"><div class="prop-label">${F.Aci}</div><div class="prop-value">${S(el.chem.aci)}</div></div>
        <div class="prop-item"><div class="prop-label">${F.ThS}</div><div class="prop-value">${S(el.chem.thS)}</div></div>

        <div class="prop-item" style="grid-column: 1 / -1;"><div class="prop-label">${F.Rea}</div><div class="prop-value">${S(el.chem.rea)}</div></div>

function buildBohrSVG(el) {
  const max = el.shells.length, cx = 100, cy = 100, stepR = max > 1 ? 66 / (max - 1) : 0;
  let circles = "", electrons = "";
  el.shells.forEach((count, i) => {
    const r = max === 1 ? 45 : 22 + i * stepR;
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1" stroke-dasharray="3,2"/>`;
    for (let j = 0; j < count; j++) {
      const a = (2 * Math.PI * j) / count - Math.PI / 2;
      electrons += `<circle cx="${(cx+r*Math.cos(a)).toFixed(2)}" cy="${(cy+r*Math.sin(a)).toFixed(2)}" r="2.6" fill="#38bdf8" stroke="#080d1a" stroke-width="0.8"/>`;
    }
  });
  return `<svg width="192" height="192" viewBox="0 0 200 200">${circles}<circle cx="${cx}" cy="${cy}" r="14" fill="rgba(244, 63, 94, 0.85)" stroke="#fda4af" stroke-width="1.5"/><text x="${cx}" y="${cy + 3.5}" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="bold">+${el.Z}</text>${electrons}</svg>`;
}

function selectElement(z, openDrawer = false) {
  state.selectedZ = z;
  // 时序修复：在更新 Grid 前更改 Drawer 状态，确保渲染 Drawer 的逻辑生效
  if (openDrawer) {
    state.drawerOpen = true; 
    document.getElementById("detail-drawer").classList.add("open");
    document.getElementById("drawer-backdrop").classList.add("open");
  }
  updateGridState();
}

function updateTemperatures(t) {
  state.tempK = t;
  document.getElementById('temp-k').textContent = `${Math.round(t)} K`;
  document.getElementById('temp-c').textContent = `(${Math.round(t - 273.15)} ℃)`;
  updateGridState();
}

function getSliderVal(t) { return t <= 500 ? t : 500 + (t - 500) / 11; }
function getTempFromSlider(val) { return val <= 500 ? val : 500 + (val - 500) * 11; }

function setSliderToTemp(t) {
  document.getElementById("temp-slider").value = getSliderVal(t);
  updateTemperatures(t);
}

let playRAF, lastTime = 0;
function playStep(time) {
  if (!state.isPlaying) return;
  const dt = time - lastTime; lastTime = time;
  let t = state.tempK + (dt * 0.5);
  if (t > 6000) t = 0;
  setSliderToTemp(t);
  playRAF = requestAnimationFrame(playStep);
}

function initEvents() {
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.lang = btn.dataset.lang;
      renderHeaderUI(); renderCategoryBar(); updateGridState();
    });
  });

  document.getElementById("search-input").addEventListener("input", e => { state.searchQuery = e.target.value; updateGridState(); });

  document.getElementById("temp-slider").addEventListener("input", e => {
    if (state.isPlaying) document.getElementById("btn-play-temp").click();
    updateTemperatures(getTempFromSlider(parseFloat(e.target.value)));
  });

  document.querySelectorAll(".temp-presets button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (state.isPlaying) document.getElementById("btn-play-temp").click();
      setSliderToTemp(parseFloat(btn.dataset.t));
    });
  });

  document.getElementById("btn-plus-10").onclick = () => setSliderToTemp(Math.min(6000, state.tempK + 10));
  document.getElementById("btn-plus-100").onclick = () => setSliderToTemp(Math.min(6000, state.tempK + 100));
  document.getElementById("btn-minus-10").onclick = () => setSliderToTemp(Math.max(0, state.tempK - 10));
  document.getElementById("btn-minus-100").onclick = () => setSliderToTemp(Math.max(0, state.tempK - 100));

  document.getElementById("btn-play-temp").addEventListener("click", function() {
    state.isPlaying = !state.isPlaying;
    if (state.isPlaying) {
      this.classList.add("playing"); document.getElementById("ui-play").textContent = UI[state.lang].pause;
      lastTime = performance.now(); playRAF = requestAnimationFrame(playStep);
    } else {
      this.classList.remove("playing"); document.getElementById("ui-play").textContent = UI[state.lang].play;
      cancelAnimationFrame(playRAF);
    }
  });

  document.querySelectorAll(".stat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.phaseFilter = state.phaseFilter === btn.dataset.filter ? null : btn.dataset.filter;
      updateGridState();
    });
  });

  document.getElementById("close-drawer-btn").onclick = () => { state.drawerOpen = false; document.getElementById("detail-drawer").classList.remove("open"); document.getElementById("drawer-backdrop").classList.remove("open"); };
  document.getElementById("drawer-backdrop").onclick = document.getElementById("close-drawer-btn").onclick;
  document.getElementById("prev-el-btn").onclick = () => selectElement(state.selectedZ > 1 ? state.selectedZ - 1 : 118, true);
  document.getElementById("next-el-btn").onclick = () => selectElement(state.selectedZ < 118 ? state.selectedZ + 1 : 1, true);
  window.addEventListener("keydown", e => {
    if (!state.drawerOpen) return;
    if (e.key === "Escape") document.getElementById("close-drawer-btn").click();
    else if (e.key === "ArrowLeft") document.getElementById("prev-el-btn").click();
    else if (e.key === "ArrowRight") document.getElementById("next-el-btn").click();
  });
}

// Initial Boot
renderHeaderUI();
renderCategoryBar();
renderPeriodicGridDOM();
setSliderToTemp(298.15); // Boot to Room Temperature
initEvents();
</script>
